function makeGalaxy(seed, c1, c2, arms, spread, size, dens = 1) {

    if (E.filter(e => !e.dead && e.t === "galaxy").length < 10) { const a0 = Math.atan2(player.y - b.y, player.x - b.x), n = hard2 ? 4 : 3; for (let k = 0; k < n; k++) spawnGalaxy(b.x, b.y + b.R * .5, a0 + (k - (n - 1) / 2) * .6, 78, true); }
  }
}
/* super sun laser: rippling plasma beam, helix ribbons, arcs, source flare and impact burst */
function drawPlayerLaser() {
  if (!giant || gl.lon <= 0 || st === "over" || clash.on) return;
  const k = Math.min(1, gl.lon / .2, (.7 - gl.lon) / .06 + .3), x = player.x, y0 = player.y - player.r * .5, flick = .88 + .12 * Math.sin(time * 90);
  let yTop = -400; if (boss && !boss.dying && boss.y < player.y && Math.abs(boss.x - x) < boss.R * 1.1 + GLW / 2) yTop = boss.y + boss.R * .8;
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const [w, a, c] of [[GLW * 2, .14, "255,190,80"], [GLW * 1.45, .34, "120,200,255"], [GLW * .95, .6, "200,235,255"], [GLW * .4, 1, "255,255,255"]]) {

  }

  ctx.lineWidth = 1.5; ctx.strokeStyle = `rgba(255,255,255,${.8 * k})`;

  for (let j = 0; j < 8; j++) { const an = time * 3 + j * TAU / 8; ctx.fillStyle = `rgba(255,255,255,${.3 * k})`; ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x + Math.cos(an - .05) * 70, y0 + Math.sin(an - .05) * 70); ctx.lineTo(x + Math.cos(an + .05) * 70, y0 + Math.sin(an + .05) * 70); ctx.fill(); }

/* the army of suns: the whole universe stands behind the player */
function buildAllies() {
  fin.allies = [];

  for (let i = 0; i < 700; i++) { const an = rnd() * TAU, rr = 70 + Math.pow(rnd(), .7) * 500; fin.allies.push({ ox: Math.cos(an) * rr * 1.15, oy: Math.sin(an) * rr * .55 - 20, s: 3 + rnd() * 9, ph: rnd() * TAU, ti: (rnd() * 4) | 0 }); }

    const S = MINI[a.ti], d = S.size * (a.s * k * (1 + .12 * Math.sin(time * 4 + a.ph)) / S.core);
    ctx.drawImage(S.sprite, player.x + a.ox + Math.sin(time * .6 + a.ph) * 5 - d / 2, player.y + a.oy + Math.cos(time * .5 + a.ph) * 4 - d / 2, d, d);

/* ---- finale boss: harder, shield-then-fight ---- */
function finAttack(b, dt, lv) {
  b.bf -= dt;
  if (b.bf <= 0) {
    b.bf = lv === 1 ? 2.2 : lv === 2 ? 1.4 : 1.0; const n = lv === 3 ? 38 : 26, off = rnd() * TAU, a0 = Math.atan2(player.y - b.y, player.x - b.x);
    for (let i = 0; i < n; i++) { const an = off + i / n * TAU; if (Math.abs(angDiff(an, a0)) < .3) continue; EB.push(eb(b.x, b.y, an, lv === 3 ? 120 : 105, 4)); }
  }
  b.br -= dt;
  if (b.br <= 0) { b.br = lv === 1 ? 1.3 : lv === 2 ? .9 : .7; const a0 = Math.atan2(player.y - b.y, player.x - b.x), n = lv === 3 ? 4 : 2; for (let k = -n; k <= n; k++) EB.push(eb(b.x, b.y, a0 + k * .13, 190, 4)); }
  if (lv >= 2) {
    b.sp1 = (b.sp1 || 0) - dt;
    if (b.sp1 <= 0) { b.sp1 = lv === 3 ? .05 : .08; b.sa = (b.sa || 0) + .19; const arms = lv === 3 ? 7 : 5; for (let k = 0; k < arms; k++) EB.push(eb(b.x, b.y, b.sa + k / arms * TAU, 115, 4)); if (lv === 3) for (let k = 0; k < 3; k++) EB.push(eb(b.x, b.y, -b.sa * 1.3 + k / 3 * TAU, 100, 4)); }
    b.cu2 = (b.cu2 || 0) - dt;
    if (b.cu2 <= 0) { b.cu2 = lv === 3 ? .55 : .9; const gx = clamp(player.x + (rnd() - .5) * 140, 60, W - 60); for (let x = 20; x < W; x += 36) { if (Math.abs(x - gx) < 66) continue; EB.push(eb(x, -20, Math.PI / 2, 160, 4)); } }
  }
  if (lv === 3) { b.lz2 = (b.lz2 || 0) - dt; if (b.lz2 <= 0) { b.lz2 = 3.2; fireLasers(2); } }
}
function finBossLogic(b, dt) {
  b.x = W / 2 + Math.sin(b.t * .4) * W * .2; b.y = H * .2 + Math.sin(b.t * .9) * 8; b.spin = .6; b.R = 96;
  if (fin.stage === 1) {
    if (b.hp <= b.max * .9) return finGo("notice");
    finAttack(b, dt, 1);
  } else if (fin.stage === 2) {
    b.shielded = b.shield > 0; finAttack(b, dt, 2);
    fin.mbT -= dt; if (fin.mbT <= 0) { fin.mbT = 2.4; if (E.filter(e => !e.dead && e.t === "mb").length < 5) spawnMB(); }
    if (b.shield <= 0) {                         // the shield shatters, but the Wall is very much alive
      b.shield = 0; b.shielded = false; fin.stage = 3; E.length = 0; EB.length = 0; DR.length = 0; fin.dq = 0;
      pixels(b.x, b.y, ["#bff3ff", "#7fd8ff", "#ffffff"], 160, 560, 4, 1.2); doShake(16, .8); flashA = 1; b.bt = 2.8; b.btxt = "The shield shatters!"; b.bf = 1.5; b.br = 2;
    }
  } else if (fin.stage === 3) {
    b.shielded = false; finAttack(b, dt, 3);
    fin.mbT -= dt; if (fin.mbT <= 0) { fin.mbT = 3.2; if (E.filter(e => !e.dead && e.t === "mb").length < 4) spawnMB(); }

/* ---- drill clash: no regrowing drills, no camera pan; the infinity sign forms over the clash ---- */
function infGeo(t) {

}
const infPt = (G, tt) => { const sn = Math.sin(tt), cs = Math.cos(tt), den = 1 + sn * sn, A = fin.half * 1.12; return [W / 2 + A * 1.25 * sn * cs / den, fin.mid - A * cs / den]; };
function infArc(G, t0, t1, w, rgb, al, twist) {
  const n = Math.max(2, Math.ceil(Math.abs(t1 - t0) * 28)); ctx.strokeStyle = `rgba(${rgb},${al})`; ctx.lineWidth = w; ctx.beginPath();
  for (let i = 0; i <= n; i++) {

    if (twist) { const q = infPt(G, tt + .01), dx = q[0] - p[0], dy = q[1] - p[1], l = Math.hypot(dx, dy) || 1, o = Math.sin(tt * 30 - time * 14) * twist; p = [p[0] - dy / l * o, p[1] + dx / l * o]; }
    i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]);

}
function drawInfinity(dt) {
  const t = fin.t, G = infGeo(t);

  const hasP = G.f > -Math.PI / 2 + .01, fa = G.fa;

  const gold = [[40, "255,150,40", .14], [18, "255,210,120", .45], [7, "255,255,255", .95]], pur = [[40, "150,40,230", .14], [18, "200,120,255", .45], [7, "255,240,255", .95]];
  if (hasP) for (const [w, c, a] of pur) infArc(G, -Math.PI / 2, G.f, w, c, a * fa, 0);
  for (const [w, c, a] of gold) infArc(G, G.f, Math.PI * 1.5, w, c, a * fa, 0);

  ctx.restore();
  drawClashBorder(1 - G.g2);

}

/* ===================== THE BIG BANG, sun wall, new gambits ===================== */
function bigBangAura(x, y, R, k = 1) {
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  glow(x, y, R * 5, "255,170,60", .35 * k); glow(x, y, R * 3, "255,240,200", .4 * k);
  for (let j = 0; j < 3; j++) { const f = (time * .9 + j / 3) % 1; ctx.strokeStyle = `rgba(255,230,160,${(1 - f) * .7 * k})`; ctx.lineWidth = 4 * (1 - f) + 1; ctx.beginPath(); ctx.arc(x, y, R * (1.2 + f * 4), 0, TAU); ctx.stroke(); }
  for (let i = 0; i < 20; i++) {
    const a = time * .8 + i * TAU / 20, len = R * (2.2 + .9 * Math.sin(time * 5 + i * 1.7) + (i % 2 ? .6 : 0));
    ctx.fillStyle = i % 2 ? `rgba(255,255,255,${.4 * k})` : `rgba(255,190,70,${.45 * k})`;
    ctx.beginPath(); ctx.moveTo(x + Math.cos(a - .08) * R * 1.05, y + Math.sin(a - .08) * R * 1.05); ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); ctx.lineTo(x + Math.cos(a + .08) * R * 1.05, y + Math.sin(a + .08) * R * 1.05); ctx.closePath(); ctx.fill();
  }

}
function makeSunWall() {
  fin.wall = [];
  for (let r = 0; r < 4; r++) for (let c = 0; c < 25; c++) fin.wall.push({ x: 24 + c * ((W - 48) / 24), y: H - 22 - r * 20, hp: 3, inv: 0, ph: rnd() * TAU });
  fin.wt = 3;
}
function wallSunsUpdate(dt) {                           // 100 suns behind the player: 10 extra drills every 3s, each dies after 3 hits
  if (!fin.wall.length || fin.cut) return;
  for (const s of fin.wall) s.inv = Math.max(0, s.inv - dt);
  const alive = fin.wall.filter(s => s.hp > 0);
  for (const b of EB) {
    if (b.dead || b.y < H - 100) continue;
    for (const s of alive) {
      if (s.hp <= 0 || s.inv > 0 || Math.hypot(b.x - s.x, b.y - s.y) >= b.r + 9) continue;
      b.dead = true; s.hp--; s.inv = 1.8; pixels(s.x, s.y, ["#ffffff", "#ffd36a", "#ff9a2e"], s.hp <= 0 ? 14 : 5, 130, 3, .5); FX.push({ x: s.x, y: s.y, age: 0, life: .3, r: 26, rgb: "255,190,90" }); break;
    }

      for (let i = 0; i < 10; i++) { const s = alive[(rnd() * alive.length) | 0]; if (s.hp <= 0) continue; DR.push({ x: s.x, y: s.y - 8, vx: (rnd() - .5) * 160, vy: -520, age: 0, h: [] }); FX.push({ x: s.x, y: s.y, age: 0, life: .3, r: 30, rgb: "255,210,120" }); }

    }
  }
}
function drawWallSuns() {
  if (!fin.wall.length) return;
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  fin.wall.forEach((s, i) => {
    if (s.hp <= 0) return;
    ctx.globalAlpha = s.inv > 0 && Math.floor(time * 16) % 2 ? .3 : 1;
    const S = MINI[i % 4], d = S.size * (9 * (1 + .1 * Math.sin(time * 4 + s.ph)) / S.core); ctx.drawImage(S.sprite, s.x - d / 2, s.y - d / 2, d, d);
  });
  ctx.restore();
}
function gmUpdate2(dt) {
  if (gm.id === "barrier") { gm.bt -= dt; if (gm.bt <= 0) { gm.bt = 20; for (const b of EB) if (!b.dead && Math.hypot(b.x - player.x, b.y - player.y) < 170) { b.dead = true; pixels(b.x, b.y, ["#ffffff", "#ffe9a0"], 3, 100, 2, .4); } FX.push({ x: player.x, y: player.y, age: 0, life: .6, r: 190, rgb: "255,230,150" }); doShake(5, .2); } }
  if (gm.id === "frost") { gm.ft -= dt; if (gm.ft <= 0) { gm.ft = 12; gm.fz = 3; FX.push({ x: player.x, y: player.y, age: 0, life: .6, r: 220, rgb: "150,220,255" }); } gm.fz = Math.max(0, gm.fz - dt); }
  if (gm.id === "dew") { gm.dwt -= dt; if (gm.dwt <= 0) { gm.dwt = 25; if (player.hp < player.maxHp) { player.hp++; FX.push({ x: player.x, y: player.y, age: 0, life: .6, r: 100, rgb: "160,255,170" }); } } }

function drawGambitFX() {

/* ===================== LOOP ===================== */

}
requestAnimationFrame(frame);
})();
