const dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);p.x=Math.max(20,Math.min(520,p.x+dx*140*dt*(S.mount<0)));p.y=Math.max(406,Math.min(478,p.y+dy*80*dt*(S.mount<0)));
