<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font:900 16px 'Arial Black',Impact,sans-serif;user-select:none}
canvas{display:block}#cv{position:fixed;inset:0}
#hud{position:fixed;inset:0;display:none;pointer-events:none;font-size:30px;text-shadow:2px 2px #000,-1px -1px #000,1px -1px #000,-1px 1px #000}
#hud>*{position:absolute}
#lap{left:130px;top:calc(env(safe-area-inset-top,0px) + 14px);color:#c9f}
#tim{right:18px;top:calc(env(safe-area-inset-top,0px) + 14px);color:#df5}
#itm{left:calc(50% - 36px);top:calc(env(safe-area-inset-top,0px) + 10px);width:66px;height:66px;border:3px solid #fff;background:#000;text-align:center;line-height:66px;font-size:40px}
#rk{left:10px;top:calc(env(safe-area-inset-top,0px) + 10px)}
#rk b{display:block;width:100px;padding:3px 6px;margin-bottom:4px;border-left:8px solid;background:#000a;font-size:15px}
#pos{left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-size:72px;color:#fb2;font-style:italic}
#mm{right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
#msg{left:0;right:0;top:28%;text-align:center;font-size:clamp(50px,12vw,110px)}
#say{display:none;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 88px);background:#fffe;color:#111;text-shadow:none;padding:8px 20px;border-radius:22px;font-size:22px;white-space:nowrap}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0007;padding:12px;overflow:auto;box-sizing:border-box}
h1{margin:0;font-size:clamp(32px,8vw,64px);background:linear-gradient(90deg,#f33,#fc0,#3c3,#39f);-webkit-background-clip:text;color:transparent;-webkit-text-stroke:1px #000}
.g{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:720px;align-items:center}
b{padding:10px 16px;background:#222c;border:3px solid var(--c,#fff);border-radius:10px;cursor:pointer}
b.on{background:var(--c,#fc0);color:#000}
input{font:inherit;width:90px;padding:10px;text-transform:uppercase;text-align:center;border-radius:10px;border:3px solid #fff;background:#222;color:#fff}
small{opacity:.8;font:600 13px Arial;text-align:center}
</style></head><body>

function loc(k){let b=1e9,bi=k.ci;for(let j=-12;j<=12;j++){const i=(k.ci+j+N)%N,d=(P[i].x-k.x)**2+(P[i].z-k.z)**2;if(d<b)b=d,bi=i}
 if(k.ci>N*.8&&bi<N*.2)k.lap++;else if(k.ci<N*.2&&bi>N*.8)k.lap--;k.ci=bi;k.d=Math.sqrt(b);k.pr=k.lap*N+bi}
const spin=k=>{if(k.st>0||k.iv>0||k.gh>0)return;k.sp=1.1;k.v*=.25;k.dd=0;k.iv=2.5;say(k)};
// ramming: momentum-based push (heavier characters shove lighter ones); each client moves only its own karts
function bump(k,b,dt){const dx=k.x-b.x,dz=k.z-b.z,d=Math.hypot(dx,dz);if(b===k||d>3||d<.01||k.gh>0||b.gh>0)return;
 const nx=dx/d,nz=dz/d,bv=b.v||0,vbx=sin(b.a)*bv,vbz=cos(b.a)*bv,rel=(sin(k.a)*k.v-vbx)*nx+(cos(k.a)*k.v-vbz)*nz,mk=1+3*(CH[k.c][4]-.94),mb=1+3*(CH[b.c][4]-.94);
 k.x+=nx*(3-d)*.5;k.z+=nz*(3-d)*.5;
 const sd=1-Math.abs(sin(k.a)*nx+cos(k.a)*nz),sh=sd*(.4+bv/120)*2*mb/(mk+mb)*dt*60;k.kx+=nx*sh;k.kz+=nz*sh; // side shove: stronger when hit from the side, scales with the other kart's speed and weight
 if(rel<0){const j=-1.8*rel/(1/mk+1/mb);k.kx+=j/mk*nx;k.kz+=j/mk*nz;k.v*=1+cl(rel/120,-.25,0);if(rel<-14&&vbx*nx+vbz*nz>10)say(k)}
 if(b.st>0)spin(k)}
// speech bubble: 3D sprite over other karts, HUD box in the sky for yourself so it never covers the road
let bag=[];const PH=['Türa küll','Situ pihku','Situ ube','Haige jobu oled','Juudid raisk','Kuradi Illar Mati raisk'],phr=()=>(bag.length||(bag=[...PH].sort(()=>rnd()-.5)),bag.pop());
function say(k){if(k.bt>0)return;const t=phr();k.sy=t;k.sn=(k.sn|0)+1;bub(k,t)}
function bub(k,t){k.bt=2;if(k===me){const e=$('say');e.textContent=t;e.style.display='block';return}
 k.m.remove(k.bs);const c=document.createElement('canvas'),F='bold 52px Arial',x=c.getContext('2d');x.font=F;c.width=x.measureText(t).width+60;c.height=128;x.font=F;x.fillStyle='#fffe';x.beginPath();
 x.roundRect?x.roundRect(4,4,c.width-8,84,32):x.rect(4,4,c.width-8,84);x.moveTo(c.width/2-14,86);x.lineTo(c.width/2,120);x.lineTo(c.width/2+14,86);x.fill();
 x.fillStyle='#111';x.textAlign='center';x.textBaseline='middle';x.fillText(t,c.width/2,48);
 const s=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c)}));s.scale.set(c.width/64,2,1);s.position.y=6.6;k.m.add(s);k.bs=s}
function tick(k,dt){if(k.bt>0&&(k.bt-=dt)<=0)k===me?$('say').style.display='none':k.m.remove(k.bs)}
const pick=(k,all)=>{const r=all.filter(o=>key(o)>key(k)).length,L=r<2?[2,2,1,3]:r<5?[1,1,2,3,3,6]:[1,4,5,6,7,3];k.n=0;return L[rnd()*L.length|0]};
function use(k){const t=k.it;if(!t||k.sp>0)return;k.it=0;if(t==1)k.bo=1.6;if(t==4)k.st=7;if(t==5){K.forEach(o=>o!==k&&spin(o));k.lz=(k.lz||0)+1}if(t==6){k.bo=1.4;k.n=(k.n||3)-1;if(k.n)k.it=6}if(t==7)k.gh=6;
 if(t==2)H.push({t,x:k.x-sin(k.a)*3.2,z:k.z-cos(k.a)*3.2,o:k,l:25});
 if(t==3)H.push({t,x:k.x+sin(k.a)*3,z:k.z+cos(k.a)*3,a:k.a,ci:k.ci,lap:0,o:k,l:8})}
function step(k,i,dt){const C=CH[k.c];['sp','bo','st','iv','gh'].forEach(f=>k[f]=Math.max(0,k[f]-dt));
 const bs=k.bo>0||k.st>0,mx=48*C[4]*(k.sk||1)*(bs?1.45:1)*(k.d>W?.5:1);
 if(k.sp>0){k.a+=11*dt;i={s:0,g:0}}
 k.v+=((bs||i.g>0?mx:i.g<0?-mx*.3:0)-k.v)*(bs?4:i.g>0?1.3*C[5]:i.g<0?3:.5)*dt;
 if(i.d&&!k.dd&&k.v>20&&Math.abs(i.s)>.3)k.dd=Math.sign(i.s),k.dt=0;
 if(k.dd){k.dt+=dt;if(!i.d){k.bo=k.dt>2.2?2:k.dt>1.2?1.3:k.bo;k.dd=0}}
 k.a+=(k.dd?k.dd*.9+i.s*.6:i.s*1.6)*C[6]*cl(k.v/14,-1,1)*dt;
 const d=k.a-k.dd*.3,f=Math.exp(-4*dt);k.x+=(sin(d)*k.v+k.kx)*dt;k.z+=(cos(d)*k.v+k.kz)*dt;k.kx*=f;k.kz*=f}
function aiIn(k){const j=(k.ci+9)%N,q=Q[j],p=P[j],da=wr(at(p.x+q.nx*k.ln-k.x,p.z+q.nz*k.ln-k.z)-k.a);return{s:cl(da*2.5,-1,1),g:Math.abs(da)>1?0:1}}
const keys={};onkeydown=e=>{keys[e.code]=1;if(e.code=='Space'||e.code.startsWith('Arrow'))e.preventDefault();if(e.code=='Space'&&st=='race'&&!me.ai)use(me)};onkeyup=e=>keys[e.code]=0;
const inp=()=>({s:(keys.ArrowLeft||keys.KeyA?1:0)-(keys.ArrowRight||keys.KeyD?1:0),g:(keys.ArrowUp||keys.KeyW?1:0)-(keys.ArrowDown||keys.KeyS?1:0),d:keys.ShiftLeft||keys.ShiftRight||keys.KeyX});

function go(){build(map);K=[];RK={};H=[];
 const add=(c,j,ai)=>{const i=N-8-5*(j>>1),q=Q[i],o=j%2?-4.5:4.5,k={c,ai,x:P[i].x+q.nx*o,z:P[i].z+q.nz*o,a:at(q.tx,q.tz),v:0,ci:i,lap:0,d:0,sp:0,bo:0,st:0,iv:0,dd:0,dt:0,kx:0,kz:0,it:0,sk:.9+rnd()*.08,ln:(rnd()-.5)*9,m:mk(c)};Wd.add(k.m);K.push(k);return k};
 const sl=R?R.peers().map(p=>p.peer).sort().indexOf(R.peers().find(p=>p.isMe).peer)%8:7;me=add(ch,sl,0);me.sk=1;
 if(!R)CH.map((_,c)=>c).filter(c=>c!=ch).forEach((c,j)=>add(c,j,1));
 R&&R.presence({s:1,m:map,g:seen});ca=me.a;$('say').style.display='none';st='cd';cd=3.99;$('hud').style.display='block';$('menu').style.display='none'}
function end(){st='menu';$('hud').style.display='none';$('msg').textContent='';R&&R.presence({s:0});menu()}

function upd(k,dt,now,all){
 if(st=='race'){step(k,k.ai?aiIn(k):inp(),dt);if(k.ai&&k.it&&rnd()<dt*.3)use(k)}
 loc(k);if(k.d>W+5){const p=P[k.ci],f=(k.d-W-5)/k.d;k.x+=(p.x-k.x)*f;k.z+=(p.z-k.z)*f;k.v*=.97}
 all.forEach(b=>bump(k,b,dt));
 for(const h of[...H,...RH])if(!k.iv&&!(k.st>0)&&!(k.gh>0)&&h.o!==k&&Math.hypot(h.x-k.x,h.z-k.z)<2.6){spin(k);h.l=0;break}
 B.forEach(b=>{if(!b.r&&!k.it&&Math.hypot(k.x-b.x,k.z-b.z)<3.2){b.r=3;k.it=pick(k,all)}});
 if(k.lap>3&&!k.fin){k.fin=now-t0;if(k===me){k.ai=true;k.it=0;$('msg').textContent=ORD[all.filter(o=>key(o)>key(k)).length]+'!';setTimeout(end,4500)}}
 PD.forEach(d=>Math.hypot(k.x-d.x,k.z-d.z)<4&&(k.bo=Math.max(k.bo,1.1)));
 if(k.dd&&k.v>10)spark(k,k.dt>2.2?[.9,.3,1]:k.dt>1.2?[.3,.6,1]:[1,.7,.1]);if(k.bo>0&&rnd()<.6)spark(k,[1,.5,0]);
 const m=k.m,bs=k.bo>0||k.st>0;m.position.set(k.x,k.dd?.25+.15*sin(now/60):0,k.z);m.rotation.y=k.a+k.dd*.25;m.f.visible=bs;m.scale.setScalar(k.st>0?1+.1*sin(now/50):1);m.visible=!(k.gh>0)||sin(now/70)>0;m.w.forEach(w=>w.rotation.x+=k.v*dt*.6);tick(k,dt)}

function race(now,dt){
 if(st=='cd'){cd-=dt;$('msg').textContent=cd>0?Math.ceil(cd):'GO!';if(cd<=0){st='race';t0=now;if(inp().g>0)me.bo=1.2;setTimeout(()=>{if(!me.fin)$('msg').textContent=''},900)}}
 const ps=R?R.peers().filter(p=>!p.isMe&&p.presence.s==1&&p.presence.m==map):[];RH=[];
 Object.keys(RK).forEach(id=>{if(!ps.some(p=>p.peer==id)){Wd.remove(RK[id].m);delete RK[id]}});
 ps.forEach(p=>{const q=p.presence;if(q.x==null)return;let r=RK[p.peer];if(!r){r=RK[p.peer]={c:q.c,m:mk(q.c),x:q.x,z:q.z,a:q.a,lz:q.lz,sn:q.sn};Wd.add(r.m)}
  q.lz!==r.lz&&(r.lz=q.lz,spin(me));r.x+=(q.x-r.x)*.3;r.z+=(q.z-r.z)*.3;r.a+=wr(q.a-r.a)*.3;r.pr=q.p;r.v=q.v;q.sn!==r.sn&&(r.sn=q.sn,q.sy&&bub(r,q.sy));tick(r,dt);r.m.position.set(r.x,0,r.z);r.m.rotation.y=r.a;(q.o||[]).forEach(([t,x,z])=>RH.push({t,x,z,l:1}))});
 const all=[...K,...Object.values(RK)];
 H=H.filter(h=>(h.l-=dt)>0);
 H.forEach(h=>{if(h.t!=3)return;let tg=P[(h.ci+8)%N],bd=70;all.forEach(o=>{const d=Math.hypot(o.x-h.x,o.z-h.z);if(o!==h.o&&d<bd&&(o.x-h.x)*sin(h.a)+(o.z-h.z)*cos(h.a)>0)bd=d,tg=o});
  h.a+=cl(wr(at(tg.x-h.x,tg.z-h.z)-h.a),-3*dt,3*dt);h.x+=sin(h.a)*85*dt;h.z+=cos(h.a)*85*dt;loc(h)});
 B.forEach(b=>{b.r=Math.max(0,b.r-dt);b.m.visible=!b.r;b.m.rotation.y+=dt*2});
 K.forEach(k=>upd(k,dt,now,all));parts(dt);
 const vis=[...H,...RH];vis.forEach((h,j)=>{let g=HV[j];if(!g){g=HV[j]=new T.Group;g.add(new T.Mesh(new T.SphereGeometry(1.1,10,8),new T.MeshLambertMaterial({color:0x2fbf3a})),new T.Mesh(new T.TorusGeometry(.9,.35,6,10,4),new T.MeshLambertMaterial({color:0xffe030})));Wd.add(g)}
  g.visible=true;g.children[0].visible=h.t==3;g.children[1].visible=h.t==2;g.position.set(h.x,1.1,h.z)});for(let j=vis.length;j<HV.length;j++)HV[j].visible=false;
 R&&R.presence({s:1,m:map,g:seen,c:me.c,lz:me.lz|0,v:me.v|0,sy:me.sy||'',sn:me.sn|0,x:+me.x.toFixed(1),z:+me.z.toFixed(1),a:+me.a.toFixed(2),p:key(me),o:H.map(h=>[h.t,+h.x.toFixed(1),+h.z.toFixed(1)])});
 ca+=wr(me.a-ca)*Math.min(1,5*dt);cam.position.set(me.x-sin(ca)*9,4.5,me.z-cos(ca)*9);cam.lookAt(me.x+sin(ca)*6,1.5,me.z+cos(ca)*6);cam.fov=66+cl(me.v,0,70)*.25;cam.updateProjectionMatrix();
 const srt=all.sort((a,b)=>key(b)-key(a));
 $('lap').textContent=`LAP ${cl(me.lap,1,3)}/3`;$('tim').textContent=fmt(me.fin||(st=='race'?now-t0:0));$('pos').textContent=ORD[srt.indexOf(me)];$('itm').textContent=['','🍄','🍌','🐢','⭐','⚡','🍄×3','👻'][me.it];
 $('rk').innerHTML=srt.slice(0,4).map((k,i)=>`<b style="border-color:${hx(CH[k.c][1])};${k===me?'color:#fd3':''}">${i+1} ${CH[k.c][0]}</b>`).join('');
 const c=$('mm').getContext('2d'),mp=o=>[10+(o.x-bx)*sc,10+(o.z-bz)*sc];c.clearRect(0,0,150,150);c.strokeStyle='#fff';c.lineWidth=5;c.beginPath();P.forEach((p,i)=>{const[x,y]=mp(p);i?c.lineTo(x,y):c.moveTo(x,y)});c.closePath();c.stroke();
 all.forEach(k=>{const[x,y]=mp(k);c.fillStyle=hx(CH[k.c][1]);c.beginPath();c.arc(x,y,k===me?6:4,0,7);c.fill();if(k===me){c.strokeStyle='#fff';c.lineWidth=2;c.stroke()}})}

function menu(){const m=$('menu');m.style.display='flex';
 m.innerHTML=`<h1>SUPER KART 64</h1><div class=g>${CH.map((c,i)=>`<b class="${i==ch?'on':''}" style="--c:${hx(c[1])}" onclick="ch=${i};menu()">${c[0]}</b>`).join('')}</div>
<div class=g>${MP.map((c,i)=>`<b class="${i==map?'on':''}" onclick="map=${i};build(${i});menu()">${c.n}</b>`).join('')}</div>
<div class=g>${R?`<span>Room ${code}: <span id=rc>${R.peers().length}</span> racer(s)</span><b onclick="seen=rnd();go()">START RACE</b><b onclick="R.leave();R=null;menu()">Leave</b>`:`<b onclick=go()>▶ SOLO RACE</b><b onclick=room(1)>Create room</b><input id=jn placeholder=CODE maxlength=4><b onclick=room(0)>Join</b>`}</div>
<small id=err>↑/W gas · ↓/S brake · ←→/A D steer · Shift drift (hold a turn, release for turbo) · Space use item</small>`}
async function room(c){const v=c?(rnd().toString(36)+'0000').slice(2,6):$('jn').value.toLowerCase().trim();if(!/^[a-z0-9]{4}$/.test(v))return $('err').textContent='Enter a 4-character code';
 try{const r=await claude.use('room');if(!r)throw 0;R=await r.join('kart-'+v);code=v.toUpperCase();R.presence({s:0,c:ch});menu()}catch(e){$('err').textContent='Multiplayer needs the shared link (open while signed in)'}}
function poll(){if(!R)return;const q=$('rc');q&&(q.textContent=R.peers().length);const p=R.peers().find(p=>!p.isMe&&p.presence.s==1&&p.presence.g!=seen);if(p){seen=p.presence.g;map=p.presence.m;go()}}

build(0);menu();
(function lp(now){requestAnimationFrame(lp);const dt=Math.min(.05,(now-last)/1e3||0);last=now;
 if(st=='menu'){const o=now/5e3;cam.position.set(cos(o)*400,170,sin(o)*400);cam.lookAt(0,0,0);cam.fov=60;cam.updateProjectionMatrix();poll()}else race(now,dt);
 if(tr){const[p,q]=tr.u,s=sin(now/2500)*90;tr.position.set(p.x+q.nx*42+q.tx*s,0,p.z+q.nz*42+q.tz*s);tr.rotation.y=at(q.tx,q.tz)}
 SPN.forEach(s=>s.rotation.z+=.01);FL.forEach(f=>f.position.y=f.y0+sin(now/900+f.position.x)*3);rd.render(S,cam)})(0);
