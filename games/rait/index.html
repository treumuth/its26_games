    if (pk.kind === 'dash') dPoly(scr, ic, [[x - 9, y - 6], [x + 3, y - 6], [x + 3, y - 11], [x + 12, y], [x + 3, y + 11], [x + 3, y + 6], [x - 9, y + 6]]);
    else if (pk.kind === 'dj') dPoly(scr, ic, [[x - 8, y + 10], [x + 8, y - 11], [x + 3, y + 2], [x + 10, y + 3], [x - 2, y + 12]]);
    else for (const dx of [-7, 0, 7]) dPoly(scr, ic, [[x + dx - 3, y + 10], [x + dx, y - 10], [x + dx + 3, y + 10]]);
  }

  // ---------------------------------------------------------------- HUD
  heart(x, y, full) {
    const pts = HEART.map(([px, py]) => [x + px * 0.72, y + py * 0.72]);
    dPoly(scr, [30, 8, 16], pts.map(([a, b]) => [a + (a - x) * 0.18, b + (b - y) * 0.18]));
    dPoly(scr, full ? [226, 52, 76] : [62, 34, 48], pts);
    if (full) dCirc(scr, [255, 170, 180], Math.trunc(x - 4), Math.trunc(y - 4), 2);
  }
  draw_hud() {
    const s = this, p = s.player;
    for (let k = 0; k < MAX_HP; k++) s.heart(30 + k * 27, 30, k < p.hp);
    for (let sg = 0; sg < 3; sg++) {
      const fr = clamp((p.pool - sg * 33) / 33, 0, 1);
      const rx = 18 + sg * 66, ry = 54;
      dRRect(scr, [12, 14, 30], rx, ry, 60, 13, 4);
      if (fr > 0) dRRect(scr, fr < 1 ? [110, 220, 255] : [190, 250, 255], rx + 2, ry + 2, Math.trunc(56 * fr), 9, 3);
      dRRect(scr, fr < 1 ? [150, 190, 220] : [255, 255, 255], rx, ry, 60, 13, 4, 2);
    }
    s.text("Lance [K / RMB]    Mend [hold Q]", F_S, [190, 200, 220], 18, 72);
    const act = s.quests.map((q, i) => [i, q]).filter(([i, q]) => q === 'active' && !s.defeated[i]);
    const bosses = s.active_bosses();
    if (act.length && !bosses.length) {
      const txt = "Quest: " + QUEST[act[0][0]];
      s.text(txt, F_S, [250, 226, 160], W - 20 - s.tw(F_S, txt), 18);
    }
    for (const b of bosses) {
      const bw = 460, x = W / 2 - bw / 2 + 90, y = 44;
      s.text(b.name + "  -  " + b.title, F_N, [240, 226, 200], x + bw / 2, y - 30, true);
      dRRect(scr, [14, 8, 18], x - 4, y - 4, bw + 8, 22, 3);
      dRect(scr, !b.enraged ? [210, 70, 70] : [255, 130, 60], x, y, Math.trunc(bw * b.hp / b.max_hp), 14);
      dRRect(scr, [210, 180, 130], x - 4, y - 4, bw + 8, 22, 3, 2);
      for (const e of [x - 8, x + bw + 8]) dPoly(scr, [210, 180, 130], [[e - 6, y + 7], [e, y], [e + 6, y + 7], [e, y + 14]]);
    }
    s.toasts.slice(-3).forEach(([txt], n) => s.text(txt, F_N, [255, 240, 210], 20, H - 120 - n * 26));
    if (s.bn) {
      const a = Math.min(1.0, s.bn[2] / 0.6, (s.bn[3] - s.bn[2]) / 0.4);
      const col = lerpc([0, 0, 0], [250, 236, 210], clamp(a, 0, 1));
      s.text(s.bn[0], s.bn[0].length < 22 ? F_B : F_M, col, W / 2, 120, true);
      s.text(s.bn[1], F_N, lerpc([0, 0, 0], [200, 190, 170], clamp(a, 0, 1)), W / 2, 176, true);
    }
  }
  draw_dialog() {
    const s = this, d = s.dialog;
    const rx = 90, ry = H - 190, rw = W - 180;
    dRRect(scr, [16, 12, 26], rx, ry, rw, 150, 8);
    dRRect(scr, [200, 170, 110], rx, ry, rw, 150, 8, 2);
    s.text(d.npc.name, F_M, [250, 214, 140], rx + 20, ry + 12);
    let line = '', y = ry + 58;
    for (const wd of d.pages[d.i].split(' ')) {
      if (s.tw(F_N, line + wd) > rw - 40) { s.text(line, F_N, [240, 236, 230], rx + 20, y); y += 28; line = ''; }
      line += wd + ' ';
    }
    s.text(line, F_N, [240, 236, 230], rx + 20, y);
    s.text("[E]", F_S, [200, 170, 110], rx + rw - 50, ry + 150 - 26);
  }
  draw_map() {
    const s = this;
    dRect(scr, [8, 8, 14], 0, 0, W, H);
    const ox = Math.floor((W - WT * 2) / 2), oy = 150;
    s.text("MAP", F_M, [240, 226, 200], W / 2, 40, true);
    scr.drawImage(s.map_surf, ox, oy);
    s.shrine_pos.forEach(([x, y], i) => {
      if (s.lit.has(i)) dCirc(scr, [255, 200, 110], ox + Math.trunc(x / TS * 2), oy + Math.trunc(y / TS * 2) - 2, 4);
    });
    s.world.arenas.forEach((a, i) => {
      if (!s.defeated[i] && s.seen.has(Math.floor(a.x0 / 8) + ',' + (Math.floor(a.fy / 8) - 1))) {
        const cx = ox + (a.x0 + 15) * 2, cy = oy + (a.fy - 8) * 2;
        dLine(scr, [255, 80, 80], [cx - 5, cy - 5], [cx + 5, cy + 5], 3);
        dLine(scr, [255, 80, 80], [cx - 5, cy + 5], [cx + 5, cy - 5], 3);
      }
    });
    const p = s.player;
    if (Math.floor(s.tick / 15) % 2) dCirc(scr, [255, 255, 255], ox + Math.trunc(p.cx() / TS * 2), oy + Math.trunc(p.cy() / TS * 2), 4);
    s.text("gold = lantern     red X = unslain boss     M / ESC to close", F_S, [180, 180, 200], W / 2, H - 60, true);
  }
  draw_pause() {
    const s = this;
    s.overlay([6, 4, 12], 190);
    s.text("PAUSED", F_B, [240, 226, 200], W / 2, 50, true);
    const rows = ["Move  A / D  or  arrows        Aim  W / S  (up-slash, down-slash = pogo)",
      "Jump  SPACE (hold = higher)    Dash  X / SHIFT    Wall-jump  SPACE on a wall",
      "Attack  Left Mouse / J         Soul Lance  Right Mouse / K  (costs 33)",
      "Mend  hold Q / L (costs 33, heals 3)    Talk / rest  E    Map  M"];
    rows.forEach((r, n) => s.text(r, F_N, [230, 224, 214], W / 2, 150 + n * 34, true));
    s.text("Hit bosses with your nail to charge your spirit - Lance and Mend share the same 3 charges.", F_S, [150, 220, 250], W / 2, 300, true);
    const have = ['dash', 'dj', 'wall'].filter(k => s.abil[k]).map(k => ABIL_INFO[k][0]);
    s.text("Abilities: " + (have.length ? have.join(", ") : "none yet"), F_N, [250, 220, 150], W / 2, 350, true);
    QUEST.forEach((q, i) => {
      const st = s.quests[i] === 'done' ? 'DONE' : (s.defeated[i] && s.quests[i] === 'active' ? 'slain - report back' : (s.quests[i] === 'active' ? 'active' : '-'));
      s.text(q + "  [" + st + "]", F_S, [210, 200, 190], W / 2, 395 + i * 24, true);
    });
    s.text("ESC to resume", F_S, [160, 160, 180], W / 2, H - 40, true);
  }
  draw_title() {
    const s = this;
    const cam = [s.tick * 0.8, 976];
    s.draw_bg(cam, 0);
    dRect(scr, [24, 22, 40], 0, 440, W, 100);
    dRect(scr, [98, 134, 70], 0, 440, W, 8);
    s.text("GLOAMVEIL", F_B, [252, 232, 196], W / 2, 110, true);
    s.text("a tale of lanterns and thorns", F_M, [214, 190, 170], W / 2, 190, true);
    s.text("ENTER  -  New Game" + (s.has_save ? "  (replaces your save)" : ""), F_M, [250, 240, 220], W / 2, 290, true);
    if (s.has_save) s.text("C  -  Continue", F_M, [250, 240, 220], W / 2, 332, true);
    s.text("A/D move   SPACE jump   LMB attack   RMB lance   hold Q mend   E interact   ESC pause", F_S, [200, 196, 210], W / 2, 480, true);
  }

  // ---------------------------------------------------------------- render
  render() {
    const s = this;
    if (s.state === 'title') { s.draw_title(); return; }
    if (s.state === 'map') { s.draw_map(); return; }
    const p = s.player;
    const ox = s.shk ? uniform(-1, 1) * s.shk : 0, oy = s.shk ? uniform(-1, 1) * s.shk : 0;
    const cam = [Math.trunc(s.cam[0] + ox), Math.trunc(s.cam[1] + oy)];
    s.draw_bg(cam, s.zone_cur, s.zone_prev, s.zone_fade);
    s.draw_decor(cam);
    s.draw_tiles(cam);
    const t = s.tick / 60;
    s.shrine_pos.forEach(([x, y], i) => { if (cam[0] - 100 < x && x < cam[0] + W + 100) s.draw_shrine(cam, i, x, y); });
    for (const n of s.npcs) if (cam[0] - 100 < n.x && n.x < cam[0] + W + 100) n.draw(scr, cam, t, p.cx());
    for (const pk of s.pickups) s.draw_pickup(cam, pk);
    for (const e of s.enemies)
      if (e.alive && cam[0] - 80 < e.x && e.x < cam[0] + W + 80 && cam[1] - 80 < e.y && e.y < cam[1] + H + 80) e.draw(scr, cam);
    for (const b of s.bosses)
      if (cam[0] - 300 < b.cx() && b.cx() < cam[0] + W + 300 && cam[1] - 300 < b.cy() && b.cy() < cam[1] + H + 300) b.draw(scr, cam);
    p.draw(scr, cam);
    for (const q of s.projs) q.draw(scr, cam);
    s.parts.draw(scr, cam);
    if (s.near && !s.dialog && !p.dead) s.prompt(s.near[0] === 'shrine' ? "E  Rest" : "E  Talk", s.near[2] - cam[0], s.near[3] - cam[1]);
    scr.drawImage(s.vig, 0, 0);
    if (s.flash[1] > 0) s.overlay(s.flash[0], s.flash[1]);
    s.draw_hud();
    if (s.dialog) s.draw_dialog();
    if (p.dead && s.death_t > 40) {
      const a = clamp((s.death_t - 40) * 4, 0, 255);
      s.overlay([0, 0, 0], s.death_t < 135 ? a : 255);
      s.text("THE LANTERN CALLS YOU BACK", F_M, [220, 200, 190], W / 2, H / 2 - 14, true);
    } else if (s.fade > 0) s.overlay([0, 0, 0], s.fade * 255 / 40);
    if (s.state === 'pause') s.draw_pause();
  }
}

// ------------------------------------------------------------------ input wiring & main loop
const g = new Game();

const BLOCK = new Set(['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Tab']);
window.addEventListener('keydown', e => {
  if (BLOCK.has(e.code)) e.preventDefault();
  g.keys.add(e.code);
  if (e.repeat) return;
  const k = e.code, P = g.pressed;
  if (k === 'Space' || k === 'KeyZ') P.add('jump');
  if (k === 'KeyX' || k === 'ShiftLeft' || k === 'ShiftRight') P.add('dash');
  if (k === 'KeyJ') P.add('atk');
  if (k === 'KeyK') P.add('spell');
  if (k === 'KeyE' || k === 'Enter' || k === 'NumpadEnter') P.add('use');
  if (k === 'Enter' || k === 'NumpadEnter') P.add('enter');
  if (k === 'KeyM') P.add('map');
  if (k === 'Escape' || k === 'KeyP') P.add('pause');
  if (k === 'KeyC') P.add('c');
});
window.addEventListener('keyup', e => g.keys.delete(e.code));
window.addEventListener('blur', () => g.keys.clear());
cv.addEventListener('mousedown', e => {
  cv.focus();
  if (e.button === 0) g.pressed.add('atk');
  else if (e.button === 2) g.pressed.add('spell');
  e.preventDefault();
});
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.focus();

let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.25, (now - last) / 1000);
  last = now;
  let steps = 0;
  while (acc >= DT && steps < 5) {
    g.step();
    g.pressed.clear();
    acc -= DT; steps++;
  }
  if (steps === 5) acc = 0;
  g.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
