<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Downhill</title>
<style>
:root{color-scheme:dark;--bg:#0b0618;box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
#mus{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));padding:8px 12px;border:1px solid rgba(201,184,255,.5);border-radius:999px;background:rgba(11,6,24,.7);color:#c9b8ff;font:500 13px system-ui,sans-serif;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="mus" type="button">♪ Load my music</button><input id="mf" type="file" accept="audio/*" hidden>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,F,HOR,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);F=Math.min(H*0.8,W*1.1);HOR=H*0.36}
addEventListener('resize',resize);resize();

const R=2,FAR=100,CAMH=3.2,CAMBACK=6,BR=0.5;
const keys={};let touchDir=0;
let state='start',ball,obs,nextObs,camX,best=0,shake=0,time=0;
try{best=+localStorage.getItem('dh_best')||0}catch(e){}

const diffAt=z=>Math.min(1,z/1200);
const widthAt=z=>9-3.5*diffAt(z);
function centerAt(z){const k=Math.min(1,z/250);return(Math.sin(z*0.03)*4+Math.sin(z*0.012+1)*6)*k}
const rnd=(a,b)=>a+Math.random()*(b-a);

function reset(){
  ball={x:0,y:0,z:0,vy:0,fall:false,speed:16};
  obs=[];nextObs=45;camX=0;shake=0;
  spawn();
}
function spawn(){
  while(nextObs<ball.z+FAR+20){
    const z=nextObs,c=centerAt(z),w=widthAt(z),d=diffAt(z);
    const ow=rnd(1.4,3);
    const x=c+rnd(-w/2+ow/2+0.3,w/2-ow/2-0.3);
    obs.push({x,z,w:ow,d:1.2,h:1.8});
    if(Math.random()<0.15+d*0.6){ // second block leaving a gap
      const ox=x>c?c-w/2+1.6:c+w/2-1.6;
      if(Math.abs(ox-x)>ow/2+3.2)obs.push({x:ox,z,w:2,d:1.2,h:1.8});
    }
    const gap=Math.max(12,20-d*8)+rnd(0,6);
    if(Math.random()<0.45){const tot=gap+8,hz=nextObs+tot/2,hc=centerAt(hz),hw=widthAt(hz),full=Math.random()<0.6;obs.push({x:full?hc:hc+rnd(-hw/4,hw/4),z:hz,w:full?hw+1:hw*0.5,d:0.8,h:0.5,j:true});nextObs+=tot}else nextObs+=gap;
  }
  obs=obs.filter(o=>o.z>ball.z-15);
}

function P(x,y,z,cz){const dz=Math.max(z-cz,0.4),s=F/dz;return[W/2+(x-camX)*s,HOR+(CAMH-y)*s,s]}
const BG=[11,6,24];
function mix(c,t){t=Math.min(1,Math.max(0,t));t=t*t;return`rgb(${c[0]+(BG[0]-c[0])*t|0},${c[1]+(BG[1]-c[1])*t|0},${c[2]+(BG[2]-c[2])*t|0})`}
function quad(a,b,c,d,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(d[0],d[1]);ctx.closePath();ctx.fill()}

function drawObs(o,cz,fog){
  const pal=o.j?[[255,235,130],[170,120,10],[250,190,30]]:[[255,120,150],[150,20,60],[235,40,90]];
  const x1=o.x-o.w/2,x2=o.x+o.w/2,z1=o.z-o.d/2,z2=o.z+o.d/2;
  if(z2<cz+0.5)return;
  const fA=P(x1,0,z1,cz),fB=P(x2,0,z1,cz),fC=P(x2,o.h,z1,cz),fD=P(x1,o.h,z1,cz);
  const bC=P(x2,o.h,z2,cz),bD=P(x1,o.h,z2,cz);
  quad(fD,fC,bC,bD,mix(pal[0],fog));
  if(camX<x1){const sa=P(x1,0,z2,cz);quad(fA,fD,bD,sa,mix(pal[1],fog))}
  else if(camX>x2){const sb=P(x2,0,z2,cz);quad(fB,fC,bC,sb,mix(pal[1],fog))}
  quad(fA,fB,fC,fD,mix(pal[2],fog));
}

function draw(){
  const cz=ball.z-CAMBACK;
  let sx=0,sy=0;if(shake>0){sx=rnd(-1,1)*shake*12;sy=rnd(-1,1)*shake*12}
  ctx.save();ctx.translate(sx,sy);
  const g=ctx.createLinearGradient(0,0,0,HOR+40);
  g.addColorStop(0,'#05020f');g.addColorStop(0.7,'#3a1466');g.addColorStop(1,'#a2306e');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,HOR+60);
  ctx.fillStyle='rgb(11,6,24)';ctx.fillRect(-20,HOR+20,W+40,H);
  // sun
  ctx.fillStyle='rgba(255,170,90,.8)';ctx.beginPath();ctx.arc(W/2,HOR-F*0.04,F*0.09,0,7);ctx.fill();

  const i0=Math.floor(cz/R),i1=Math.floor((cz+FAR)/R);
  const bucket={};
  for(const o of obs){const i=Math.floor(o.z/R);(bucket[i]=bucket[i]||[]).push(o)}
  for(let i=i1;i>=i0;i--){
    const z1=Math.max(i*R,cz+0.5),z2=(i+1)*R;
    if(z2<=z1)continue;
    const c1=centerAt(i*R),c2=centerAt(z2),w1=widthAt(i*R),w2=widthAt(z2);
    const fog=(z1-cz)/FAR;
    const a=P(c1-w1/2,0,z1,cz),b=P(c1+w1/2,0,z1,cz),c=P(c2+w2/2,0,z2,cz),d=P(c2-w2/2,0,z2,cz);
    const base=(i&1)?[40,200,230]:[30,160,210];
    quad(a,b,c,d,mix(base,fog));
    // side faces
    const a2=P(c1-w1/2,-1.2,z1,cz),d2=P(c2-w2/2,-1.2,z2,cz),b2=P(c1+w1/2,-1.2,z1,cz),c2p=P(c2+w2/2,-1.2,z2,cz);
    if(camX>c1+w1/2)quad(b,b2,c2p,c,mix([20,90,150],fog));
    if(camX<c1-w1/2)quad(a,a2,d2,d,mix([20,90,150],fog));
    ctx.strokeStyle=mix([255,255,255],fog+0.1);ctx.lineWidth=Math.max(1,a[2]*0.04);
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(d[0],d[1]);ctx.moveTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.stroke();
    const row=bucket[i];if(row)for(const o of row)drawObs(o,cz,(o.z-cz)/FAR);
  }
  // ball
  const bp=P(ball.x,ball.y+BR,ball.z,cz),r=BR*bp[2];
  if(!ball.fall){const sp=P(ball.x,0,ball.z,cz);ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(sp[0],sp[1],r*1.1,r*0.35,0,0,7);ctx.fill()}
  const bg=ctx.createRadialGradient(bp[0]-r*0.35,bp[1]-r*0.35,r*0.1,bp[0],bp[1],r);
  bg.addColorStop(0,'#ffb066');bg.addColorStop(0.45,'#f0701c');bg.addColorStop(1,'#a8400b');
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(bp[0],bp[1],r,0,7);ctx.fill();ctx.save();ctx.clip();ctx.strokeStyle='#2b1307';ctx.lineWidth=Math.max(1.5,r*0.07);const ra=ball.z/BR;ctx.beginPath();ctx.moveTo(bp[0],bp[1]-r);ctx.lineTo(bp[0],bp[1]+r);ctx.stroke();for(const k of [Math.abs(Math.sin(ra)),Math.abs(Math.cos(ra))]){ctx.beginPath();ctx.ellipse(bp[0],bp[1],r,Math.max(0.5,r*k),0,0,7);ctx.stroke()}ctx.restore();
  ctx.restore();

  // HUD
  const score=Math.floor(ball.z/4);
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font=`700 ${Math.round(F*0.05)}px system-ui,sans-serif`;
  ctx.fillText(score,20,20+F*0.05);
  ctx.font=`500 ${Math.round(F*0.025)}px system-ui,sans-serif`;ctx.fillStyle='#c9b8ff';
  ctx.fillText('BEST '+Math.max(best,score),20,24+F*0.085);
  ctx.textAlign='right';ctx.fillText(audioErr?'♪ unavailable':!musicOn?'♪ starts on tap':muted?'♪ muted (M)':(AC&&AC.state!=='running')?'♪ blocked ('+AC.state+'), tap here':'♪ on '+AC.currentTime.toFixed(0)+'s (M, ↑↓ vol)',W-20,20+F*0.03);
  ctx.textAlign='center';
  if(state!=='play'){
    ctx.fillStyle='rgba(11,6,24,.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font=`800 ${Math.round(F*0.09)}px system-ui,sans-serif`;
    ctx.fillText(state==='start'?'DOWNHILL':'CRASHED',W/2,H*0.4);
    ctx.font=`500 ${Math.round(F*0.032)}px system-ui,sans-serif`;ctx.fillStyle='#c9b8ff';
    if(state==='over')ctx.fillText('Score '+score+'  ·  Best '+best,W/2,H*0.4+F*0.07);
    ctx.fillStyle='#ffd84a';
    ctx.fillText(state==='start'?'Steer ← → · Jump Space / W (swipe up)':'Press Space or tap to retry',W/2,H*0.55);
    if(state==='start'){ctx.fillStyle='#c9b8ff';ctx.fillText('Dodge the red blocks. Don’t fall off the edge.',W/2,H*0.55+F*0.05)}
  }
}

function update(dt){
  time+=dt;
  if(shake>0)shake=Math.max(0,shake-dt*2);
  if(state==='start'){ball.z+=6*dt;ball.x=centerAt(ball.z);camX=ball.x;spawn();return}
  if(state!=='play'){return}
  ball.speed=Math.min(60,20+Math.floor(ball.z/100)*2);
  ball.z+=ball.speed*dt;
  const dir=(keys.ArrowRight||keys.d||keys.D?1:0)-(keys.ArrowLeft||keys.a||keys.A?1:0)+touchDir;
  if(!ball.fall){
    jumpBuf-=dt;if(jumpBuf>0&&ball.y<=0){ball.vy=8.5;jumpBuf=0}ball.vy-=38*dt;ball.y+=ball.vy*dt;if(ball.y<=0){ball.y=0;ball.vy=0}
    ball.x+=Math.max(-1,Math.min(1,dir))*14*dt;
    const c=centerAt(ball.z),w=widthAt(ball.z);
    if(Math.abs(ball.x-c)>w/2+0.05)ball.fall=true;
    for(const o of obs){
      if(Math.abs(ball.z-o.z)<o.d/2+BR*0.8&&Math.abs(ball.x-o.x)<o.w/2+BR*0.8&&ball.y<o.h-0.05){die();return}
    }
  }else{
    ball.vy-=30*dt;ball.y+=ball.vy*dt;
    if(ball.y<-14){die();return}
  }
  camX+=(ball.x-camX)*Math.min(1,dt*16);
  spawn();
}
function die(){
  state='over';shake=ball.fall?0:0.6;
  const s=Math.floor(ball.z/4);
  if(s>best){best=s;try{localStorage.setItem('dh_best',best)}catch(e){}}
}
/* ---- original background music (Web Audio) ---- */
let jumpBuf=0,sy=0,custom=false,customSrc,vol=3,audioErr='',AC,master,noiseBuf,muted=false,musicOn=false,nextT=0,mstep=0;
const N=m=>440*Math.pow(2,(m-69)/12);
const CH=[{r:38,n:[62,65,69]},{r:43,n:[62,67,70]},{r:36,n:[64,67,72]},{r:41,n:[65,69,72]}];
const ARP=[0,1,2,1,2,1,2,1];
function env(g,t,a,dur,vol){g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+dur)}
function tone(type,f,t,dur,vol,lp,a){const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();o.type=type;o.frequency.value=f;fl.type='lowpass';fl.frequency.value=lp;env(g,t,a||0.01,dur,vol);o.connect(fl);fl.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05)}
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(40,t+0.12);env(g,t,0.005,0.25,0.7);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.3)}
function hat(t){const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();s.buffer=noiseBuf;f.type='highpass';f.frequency.value=7000;env(g,t,0.002,0.06,0.2);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+0.08)}
const PCH=[{r:43,n:[55,59,62,67]},{r:38,n:[57,62,66,69]},{r:40,n:[55,59,64,67]},{r:36,n:[55,60,64,67]}];
const PROG=[0,1,2,3,0,1,3,1];
const MEL=[
[[0,74,2],[2,76,2],[4,74,4],[8,71,3],[11,69,2],[13,71,3]],
[[0,69,2],[2,71,2],[4,74,4],[8,78,4],[12,76,2],[14,74,2]],
[[0,71,3],[3,76,3],[6,74,2],[8,71,4],[12,67,2],[14,71,2]],
[[0,72,4],[4,76,4],[8,74,2],[10,72,2],[12,71,4]],
[[0,74,2],[2,76,2],[4,79,4],[8,76,3],[11,74,2],[13,71,3]],
[[0,78,4],[4,76,2],[6,74,2],[8,69,4],[12,71,2],[14,74,2]],
[[0,72,3],[3,74,3],[6,76,2],[8,79,4],[12,76,4]],
[[0,74,2],[2,71,2],[4,69,4],[8,74,6],[14,78,2]]];
function loadTrack(f){
  startMusic();if(!AC)return;
  f.arrayBuffer().then(b=>AC.decodeAudioData(b)).then(buf=>{
    if(customSrc){try{customSrc.stop()}catch(e){}}
    const cg=AC.createGain();cg.gain.value=0.35;cg.connect(master);
    customSrc=AC.createBufferSource();customSrc.buffer=buf;customSrc.loop=true;customSrc.connect(cg);customSrc.start();
    custom=true;mus.textContent='♪ Change music';
  }).catch(()=>{audioErr='could not play that file'});
}
const mus=document.getElementById('mus'),mf=document.getElementById('mf');
mus.tabIndex=-1;
mus.addEventListener('click',()=>{startMusic();mus.blur();mf.click()});
mf.addEventListener('change',()=>{const f=mf.files&&mf.files[0];if(f)loadTrack(f);mf.value=''});
function snare(t){const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=1800;env(g,t,0.002,0.09,0.5);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+0.1);tone('triangle',190,t,0.08,0.25,1500)}
function sched(step,t){
  if(custom)return;const bar=Math.floor(step/16)%8,s=step%16,c=PCH[PROG[bar]];
  if(s%2===0)c.n.forEach((n,i)=>tone('sawtooth',N(n),t+i*0.012,0.3,s%4===0?0.1:0.065,2400));
  if([0,3,6,8,11,14].includes(s)){tone('sine',N(c.r),t,0.3,0.8,300);tone('triangle',N(c.r+12),t,0.25,0.25,1200)}
  if(s===0||s===6||s===8||s===10)kick(t);
  if(s===4||s===12)snare(t);
  if(s%2===0)hat(t);
  for(const m of MEL[bar])if(m[0]===s)tone('square',N(m[1]),t,m[2]*0.12,0.14,2600);
}
function schedOld(step,t){
  const c=CH[Math.floor(step/16)%4],s=step%16;
  if(s===0){tone('sine',N(c.r),t,2.2,0.7,300);tone('triangle',N(c.r+12),t,0.5,0.25,1200);for(const n of c.n){tone('sawtooth',N(n-12),t,2.4,0.1,900,0.5);tone('sawtooth',N(n-12)*1.004,t,2.4,0.08,900,0.5)}}
  if(s%2===0)tone('triangle',N(c.n[ARP[s/2]]+12),t,0.35,0.3,3200);
  if(s%4===0)kick(t);
  if(s%4===2)hat(t);
}
function startMusic(){
  try{
    if(!AC){
      AC=new (window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain();master.gain.value=muted?0:vol;const comp=AC.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=12;comp.knee.value=6;master.connect(comp);comp.connect(AC.destination);
      noiseBuf=AC.createBuffer(1,AC.sampleRate*0.1,AC.sampleRate);
      const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }
    try{navigator.audioSession&&(navigator.audioSession.type='playback')}catch(e){}try{const sa=new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAABErAAABAAgAZGF0YQAAAAA=');sa.play().catch(()=>{})}catch(e){}AC.resume&&AC.resume().catch(()=>{});tone('sine',660,AC.currentTime+0.02,0.25,0.5,4000);
    if(!musicOn){musicOn=true;nextT=AC.currentTime+0.1;mstep=0;
      setInterval(()=>{if(nextT<AC.currentTime)nextT=AC.currentTime+0.05;while(nextT<AC.currentTime+0.2){sched(mstep,nextT);nextT+=0.125;mstep++}},50)}
  }catch(e){audioErr=String(e)}
}
function setVol(m){vol=Math.min(8,Math.max(0.3,vol*m));muted=false;if(master)master.gain.value=vol}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:vol}
function begin(){if(state==='play')return;reset();state='play';startMusic()}

addEventListener('keydown',e=>{
  keys[e.key]=true;if(state==='play'&&(e.key===' '||e.key==='w'||e.key==='W'))jumpBuf=0.15;if(e.key==='m'||e.key==='M')toggleMute();if(e.key==='ArrowUp'||e.key==='+'||e.key==='=')setVol(1.5);if(e.key==='ArrowDown'||e.key==='-')setVol(1/1.5);
  if(e.key===' '||e.key==='Enter'){if(state!=='play'&&(state==='start'||time-endT>0.4))begin()}
  if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.key]=false});
let endT=0;
function pt(e){touchDir=e.clientX<W/2?-1:1}
cv.addEventListener('pointerdown',e=>{sy=e.clientY;if(e.clientX>W-130&&e.clientY<60){if(AC&&AC.state!=='running')AC.resume();else toggleMute();return}
  if(state!=='play'){if(state==='start'||time-endT>0.4)begin();return}
  pt(e)});
cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch'){if(state==='play'&&touchDir)pt(e);if(state==='play'&&sy-e.clientY>45){jumpBuf=0.15;sy=e.clientY}}});
addEventListener('pointerup',()=>{touchDir=0});
addEventListener('pointercancel',()=>{touchDir=0});

reset();
let last=performance.now(),prev='start';
function loop(t){
  const dt=Math.min(0.05,(t-last)/1000);last=t;
  update(dt);
  if(prev==='play'&&state==='over')endT=time;
  prev=state;
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
